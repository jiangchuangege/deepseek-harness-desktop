<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html,body{margin:0;padding:0;background:#20222a;overflow:hidden;user-select:none;font-family:'Segoe UI',sans-serif;}
  #pet{ position:relative; width:128px; height:128px; margin:4px; cursor:grab; -webkit-app-region:drag; }
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  #ring{ position:absolute; inset:0; border-radius:18px; pointer-events:none;
    box-shadow:0 0 0 2px rgba(110,168,255,.55), 0 8px 22px rgba(0,0,0,.45); animation:bob 3.4s ease-in-out infinite; }
  #pet img{ width:100%; height:100%; object-fit:cover; border-radius:18px; animation:bob 3.4s ease-in-out infinite; }
  #x{ position:absolute; top:8px; right:8px; z-index:5; width:22px; height:22px; border-radius:50%;
    background:#e5484d; color:#fff; font:12px/22px sans-serif; text-align:center; cursor:pointer;
    -webkit-app-region:no-drag; box-shadow:0 2px 6px rgba(0,0,0,.4); }
  #hint{ position:absolute; bottom:6px; left:0; right:0; text-align:center; color:#8f97a8; font-size:11px; -webkit-app-region:no-drag; }
</style>
</head>
<body>
  <div id="pet" title="点击打开菜单(可拖拽)">
    <div id="ring"></div>
    <img src="./assets/icon.png" alt="宠物" draggable="false" />
    <div id="x" title="关闭宠物">×</div>
    <div id="hint">点我</div>
  </div>
<script>
  const pet=document.getElementById('pet');
  document.getElementById('x').addEventListener('click',()=>window.close());
  // 点击宠物 → 弹出原生功能菜单
  pet.addEventListener('click', e=>{
    if(e.target.id==='x') return;
    if(window.harnessDesktop && window.harnessDesktop.openPetMenu) window.harnessDesktop.openPetMenu();
  });
</script>
</body>
</html>
