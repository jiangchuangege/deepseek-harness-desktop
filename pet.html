<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html,body{margin:0;padding:0;background:transparent;overflow:hidden;user-select:none;font-family:'Segoe UI',sans-serif;}
  canvas{position:absolute;inset:0;z-index:1;cursor:grab;}
  #x{ position:absolute; top:6px; right:6px; z-index:5; width:20px; height:20px; border-radius:50%;
    background:#e5484d; color:#fff; font:11px/20px sans-serif; text-align:center; cursor:pointer;
    -webkit-app-region:no-drag; box-shadow:0 2px 6px rgba(0,0,0,.35); }
  #hint{ position:absolute; bottom:6px; left:0; right:0; z-index:5; text-align:center; color:#cbd3e1; font-size:11px;
    -webkit-app-region:no-drag; text-shadow:0 1px 3px rgba(0,0,0,.6); }
  #strip{ position:absolute; inset:0; z-index:2; display:flex; align-items:center; justify-content:center; color:#8f97a8; font-size:12px; }
  #strip.hide{ display:none; }
  #fallback{ position:absolute; inset:0; z-index:0; display:none; align-items:center; justify-content:center; }
  #fallback img{ width:128px; height:128px; border-radius:50%; box-shadow:0 6px 18px rgba(0,0,0,.4); }
</style>
</head>
<body>
  <canvas id="pcanvas"></canvas>
  <div id="strip">角色加载中…</div>
  <div id="fallback"><img src="./assets/icon.png" alt="宠物" draggable="false" /></div>
  <div id="x" title="关闭宠物">×</div>
  <div id="hint">点我</div>
<script src="./assets/live2dcubismcore.min.js"></script>
<script src="./assets/pet-live2d.js"></script>
<script>
  const canvas=document.getElementById('pcanvas');
  const x=document.getElementById('x');
  const strip=document.getElementById('strip');
  const fallback=document.getElementById('fallback');
  canvas.width=window.innerWidth; canvas.height=window.innerHeight;
  x.addEventListener('click',()=>window.close());
  const HD=window.harnessDesktop;

  function showFallback(){ strip.classList.add('hide'); fallback.style.display='flex'; }
  async function initLive2D(){
    if(typeof window.startPetLive2D!=='function'){ showFallback(); return; }
    const r=await window.startPetLive2D(canvas, './assets/live2d/haru/haru_greeter_t03.model3.json');
    strip.classList.add('hide');
    if(!r || !r.ok){ showFallback(); }
  }
  initLive2D();

  // 拖拽 + 轻点菜单(主进程轮询鼠标拖动; 移动>阈值=拖, 否则=点击弹菜单)
  let down=false, sx=0, sy=0, moved=false;
  document.body.addEventListener('mousedown', e=>{
    if(e.target.id==='x') return;
    down=true; moved=false; sx=e.screenX; sy=e.screenY;
    if(HD && HD.startDrag) HD.startDrag();
  });
  window.addEventListener('mousemove', e=>{
    if(!down) return;
    if(Math.abs(e.screenX-sx)+Math.abs(e.screenY-sy) > 5) moved=true;
  });
  window.addEventListener('mouseup', e=>{
    if(!down) return; down=false;
    if(HD && HD.stopDrag) HD.stopDrag();
    if(!moved && HD && HD.openPetMenu) HD.openPetMenu();
  });
</script>
</body>
</html>
