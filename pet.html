<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html,body{margin:0;padding:0;background:#20222a;overflow:hidden;user-select:none;font-family:'Segoe UI',sans-serif;}
  #pet{ position:relative; width:180px; height:180px; margin:4px; cursor:grab; }
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  #ring{ position:absolute; inset:0; border-radius:20px; pointer-events:none;
    box-shadow:0 0 0 2px rgba(110,168,255,.55), 0 8px 22px rgba(0,0,0,.45); }
  #pet img{ width:100%; height:100%; object-fit:cover; border-radius:20px; }
  /* 静止; 悬停时轻微动一下(减少常驻动画占用, 减轻卡顿) */
  #pet:hover img{ animation:bob 1.6s ease-in-out; }
  #x{ position:absolute; top:8px; right:8px; z-index:5; width:22px; height:22px; border-radius:50%;
    background:#e5484d; color:#fff; font:12px/22px sans-serif; text-align:center; cursor:pointer;
    -webkit-app-region:no-drag; box-shadow:0 2px 6px rgba(0,0,0,.4); }
  #hint{ position:absolute; bottom:6px; left:0; right:0; text-align:center; color:#8f97a8; font-size:11px; -webkit-app-region:no-drag; }
</style>
</head>
<body>
  <div id="pet" title="点击打开菜单(可拖拽)">
    <div id="ring"></div>
    <img src="./assets/icon.png" alt="宠物" draggable="false" />
    <div id="x" title="关闭宠物">×</div>
    <div id="hint">点我</div>
  </div>
<script>
  const pet=document.getElementById('pet');
  document.getElementById('x').addEventListener('click',()=>window.close());
  const HD = window.harnessDesktop;
  // 主进程轮询鼠标拖动(流畅) + 轻点弹菜单: 移动>阈值=拖动, 否则=点击
  let down=false, sx=0, sy=0, moved=false;
  pet.addEventListener('mousedown', e=>{
    if(e.target.id==='x') return;
    down=true; moved=false; sx=e.screenX; sy=e.screenY;
    if(HD && HD.startDrag) HD.startDrag();
  });
  window.addEventListener('mousemove', e=>{
    if(!down) return;
    if(Math.abs(e.screenX-sx)+Math.abs(e.screenY-sy) > 5) moved=true;
  });
  window.addEventListener('mouseup', e=>{
    if(!down) return; down=false;
    if(HD && HD.stopDrag) HD.stopDrag();
    if(!moved && HD && HD.openPetMenu) HD.openPetMenu();   // 未拖动 → 弹菜单
  });
</script>
</body>
</html>
