<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body{margin:0;padding:0;background:#1e1f24;color:#e9ecf5;font-family:'Segoe UI',sans-serif;display:flex;flex-direction:column;height:100vh;}
  .h{ padding:10px 14px; background:linear-gradient(135deg,#2a2c36,#20222b); border-bottom:1px solid #343741; font-weight:600; }
  .h small{ color:#8f97a8; font-weight:400; margin-left:8px; }
  #mode{ float:right; font-size:11px; padding:2px 8px; border-radius:10px; background:#2a2c33; color:#98a0b0; }
  #mode.on{ background:#12301d; color:#4ade80; }
  #mode.off{ background:#3a1520; color:#f87171; }
  #log{ flex:1; overflow:auto; padding:12px; font-size:13px; }
  #log div{ margin:6px 0; padding:7px 11px; border-radius:12px; max-width:80%; white-space:pre-wrap; word-break:break-word; }
  #log .pet{ background:#2b2e38; color:#dfe4f0; }
  #log .me{ background:#3b82f6; color:#fff; margin-left:auto; text-align:right; }
  #log .sys{ background:transparent; color:#8f97a8; font-size:11.5px; text-align:center; max-width:100%; padding:2px; }
  .row{ display:flex; gap:8px; padding:10px 12px; border-top:1px solid #343741; }
  .row input{ flex:1; background:#2a2d36; border:1px solid #3a3e49; border-radius:10px; color:#eef; padding:9px 12px; font-size:13px; }
  .row button{ background:#3b82f6; color:#fff; border:none; border-radius:10px; padding:9px 18px; cursor:pointer; font-size:13px; }
  .row button:disabled{ background:#4b5563; cursor:default; }
</style>
</head>
<body>
  <div class="h">DeepSeek Harness 小宠物 <small>聊天 v2</small><span id="mode">检测中…</span></div>
  <div id="log"><div class="pet">你好呀~ 我是你的小宠物小H，来聊聊天吧 ^_^</div></div>
  <div class="row"><input id="msg" placeholder="跟我说话...(本地模型在线时由模型回答)" /><button id="send">发送</button></div>
<script>
  const log=document.getElementById('log'), msg=document.getElementById('msg'), send=document.getElementById('send'), mode=document.getElementById('mode');
  const HD = window.harnessDesktop;
  function add(cls,t){ const d=document.createElement('div'); d.className=cls; d.textContent=t; log.appendChild(d); log.scrollTop=log.scrollHeight; }
  function addSys(t){ add('sys','— '+t+' —'); }
  // 离线时的内置规则回复(模型不可用时兜底)
  function ruleReply(t){ const L=t.toLowerCase();
    if(/你好|hi|hello/.test(L)) return '你好呀~ 很高兴见到你！';
    if(/名字|name/.test(L)) return '我是 DeepSeek Harness 的小宠物小H~';
    if(/代码|写|code/.test(L)) return '陪你写代码没问题！记得保存哦~';
    if(/累|休息/.test(L)) return '辛苦啦，记得休息一下~';
    return '我在听呢，请继续说~'; }
  let modelMode='off';
  async function initMode(){
    if(!HD || !HD.checkProxy) return;
    const r=await HD.checkProxy();
    if(r.ok && r.models && r.models.length){
      modelMode='on'; mode.textContent='本地模型 · '+r.models[0]; mode.className='on';
      addSys('已连接本地模型('+r.models[0]+'), 你的消息会发给它回答');
    } else {
      modelMode='off'; mode.textContent='离线(内置回复)'; mode.className='off';
      addSys('本地模型未连接, 使用内置规则回复。启动补丁代理并让上游模型跑起来后可自动切换。');
    }
  }
  async function talk(){
    const t=msg.value.trim(); if(!t) return;
    msg.value=''; add('me',t); send.disabled=true;
    let reply='', via='';
    if(modelMode==='on' && HD && HD.chatSend){
      try {
        const r=await HD.chatSend(t);
        if(r.ok && r.reply){ reply=r.reply; via='model'; }
      } catch {}
    }
    if(!reply){ reply=ruleReply(t); via='rule'; }
    setTimeout(()=>{ add('pet',reply); if(via==='rule' && modelMode==='on') addSys('(模型暂无回复, 已用内置回复)'); send.disabled=false; msg.focus(); }, 300);
    log.scrollTop=log.scrollHeight;
  }
  send.addEventListener('click',talk); msg.addEventListener('keydown',e=>{ if(e.key==='Enter') talk(); });
  initMode(); msg.focus();
</script>
</body>
</html>
