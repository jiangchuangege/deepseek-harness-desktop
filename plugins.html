<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body { margin:0; padding:18px; font-family:'Segoe UI',sans-serif; background:#1e1f24; color:#e6e6ef; }
  h2 { margin:0 0 2px; font-size:18px; }
  p.sub { margin:0 0 14px; color:#9aa0b0; font-size:13px; }
  .search { display:flex; gap:8px; margin-bottom:14px; }
  .search input { flex:1; padding:9px 12px; border-radius:10px; border:1px solid #3a3d47; background:#2a2c33; color:#eee; font-size:14px; }
  .search button { background:#3b82f6; color:#fff; border:none; border-radius:10px; padding:9px 18px; cursor:pointer; font-size:14px; }
  .card { background:#2a2c33; border:1px solid #373a44; border-radius:12px; padding:12px 16px; margin:8px 0; }
  .card .name { font-weight:600; font-size:15px; }
  .card .desc { color:#9aa0b0; font-size:13px; margin-top:4px; }
  .card .acts { margin-top:10px; display:flex; gap:8px; align-items:center; }
  .card a { color:#7fb0ff; text-decoration:none; font-size:13px; }
  .card button { background:#3b82f6; color:#fff; border:none; border-radius:8px; padding:6px 14px; cursor:pointer; font-size:13px; }
  .card button:hover { background:#2f6fd6; }
  .card .pkg { color:#9aa0b0; font-size:12px; }
  #status { position:fixed; bottom:12px; left:18px; color:#8fd18f; font-size:13px; }
</style>
</head>
<body>
  <h2>社区插件市场</h2>
  <p class="sub">搜索 GitHub 上的 DeepSeek Harness / 社区插件,可直接打开仓库、复制包名后安装。也可在下方精选里浏览。</p>
  <div class="search">
    <input id="q" placeholder="搜索社区插件, 例如: dsh agent  /  deepseek harness plugin" value="deepseek harness" />
    <button id="go">搜索</button>
  </div>
  <div id="results">加载引导中...</div>
  <div class="status" id="status"></div>
<script>
  const results=document.getElementById('results'), status=document.getElementById('status'), q=document.getElementById('q'), go=document.getElementById('go');
  const curated=[
    {name:'DSH Agent 预设', desc:'standard / code / minimal 多套 Agent 预设(内置)', pkg:'@deepseek-ai/dsh-agent-presets', url:''},
    {name:'Cordis 插件开发技能', desc:'用 Cordis 编写/扩展 DSH 插件(内置技能)', pkg:'', url:''},
    {name:'本地工具调用补丁', desc:'把本地模型 <tools> 改写为标准 tool_calls(自带)', pkg:'', url:''}
  ];
  function showCards(list, note){
    if(!list.length){ results.innerHTML='<div class="card"><div class="desc">没有结果。可试其它关键词, 或直接去 GitHub 搜索。</div></div>'; return; }
    let h = note ? `<div class="card"><div class="desc">${note}</div></div>` : '';
    for(const it of list){
      const acts = it.url ? `<a href="${it.url}" target="_blank">打开仓库 ↗</a>` : '';
      const pkg = it.pkg ? `<button onclick="copy('${it.pkg}')">复制包名</button><span class="pkg">${it.pkg}</span>` : '';
      h += `<div class="card"><div class="name">${it.name}</div><div class="desc">${it.desc||''}</div><div class="acts">${acts}${pkg}</div></div>`;
    }
    results.innerHTML = h;
  }
  function curate(){ showCards(curated,'精选(内置/开箱即用):'); }
  async function search(){
    const kw = q.value.trim(); if(!kw) return;
    status.textContent='正在搜索 GitHub 社区插件...';
    const r = await window.harnessDesktop.searchPlugins(kw);
    status.textContent = r.ok ? (`找到 ${r.items.length} 个仓库`) : ('✗ '+r.error);
    const list = (r.items||[]).map(x=>({ name:x.full_name, desc:(x.description||''), url:x.html_url }));
    showCards(list.length ? list : curated, list.length? '' : '搜索未命中, 回退到精选:');
  }
  window.addEventListener('DOMContentLoaded', curate);
  go.addEventListener('click', search);
  q.addEventListener('keydown', e=>{ if(e.key==='Enter') search(); });
  window.copy = txt => { navigator.clipboard.writeText(txt).then(()=>{ status.textContent='已复制: '+txt; }); };
</script>
</body>
</html>
