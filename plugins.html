<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body{margin:0;padding:16px;font-family:'Segoe UI',sans-serif;background:#1e1f24;color:#e6e6ef;}
  .top{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .tabs{display:flex;gap:6px;background:#2a2c33;border-radius:10px;padding:4px;}
  .tabs button{background:transparent;color:#98a0b0;border:none;border-radius:8px;padding:7px 16px;cursor:pointer;font-size:13px;}
  .tabs button.on{background:#3b82f6;color:#fff;}
  h2{margin:0;font-size:17px;}
  p.sub{margin:0 0 12px;color:#9aa0b0;font-size:12.5px;}
  .search{display:flex;gap:8px;margin-bottom:12px;}
  .search input{flex:1;padding:9px 12px;border-radius:10px;border:1px solid #3a3d47;background:#2a2c33;color:#eee;font-size:13px;}
  .search button{background:#3b82f6;color:#fff;border:none;border-radius:10px;padding:9px 18px;cursor:pointer;font-size:13px;}
  /* 补丁在线状态徽标 */
  #pstat{margin-left:auto;font-size:12px;padding:5px 12px;border-radius:20px;background:#2a2c33;color:#98a0b0;white-space:nowrap;}
  #pstat.on{background:#12301d;color:#4ade80;}
  #pstat.off{background:#3a1520;color:#f87171;}
  /* 进度条 */
  #prog{display:none;margin-bottom:12px;background:#2a2c33;border:1px solid #373a44;border-radius:12px;padding:10px 14px;}
  #prog .lbl{display:flex;justify-content:space-between;font-size:12.5px;color:#9aa0b0;margin-bottom:6px;}
  #bar{height:10px;background:#1a1c21;border-radius:6px;overflow:hidden;}
  #bar i{display:block;height:100%;width:40%;background:linear-gradient(90deg,#6ea8ff,#8f7bff);
    animation:slide 1s linear infinite;}
  @keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
  #plog{font-size:11.5px;color:#8fd18f;margin-top:6px;max-height:54px;overflow:auto;font-family:Consolas,monospace;}
  .card{background:#2a2c33;border:1px solid #373a44;border-radius:12px;padding:11px 15px;margin:8px 0;}
  .card .name{font-weight:600;font-size:14px;}
  .card .desc{color:#9aa0b0;font-size:12.5px;margin-top:3px;}
  .card .acts{margin-top:9px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .card a{color:#7fb0ff;text-decoration:none;font-size:12.5px;}
  .card button{background:#3b82f6;color:#fff;border:none;border-radius:8px;padding:6px 13px;cursor:pointer;font-size:12.5px;}
  .card button.g{background:#22c55e;}
  .card button:disabled{background:#4b5563;}
  .pkg{color:#9aa0b0;font-size:11.5px;}
  .mi2{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-top:1px solid #343741;font-size:13px;}
  .mi2 .acts{margin-top:0;}
  .mi2 .go{background:#22c55e;} .mi2 .stop{background:#e5484d;} .mi2 .del{background:#374151;}
  .mi2 button{border:none;border-radius:8px;padding:5px 14px;font-size:12.5px;cursor:pointer;color:#fff;}
  #status{position:fixed;bottom:12px;left:16px;color:#8fd18f;font-size:12.5px;}
</style>
</head>
<body>
  <div class="top"><h2>社区插件 &amp; MCP 市场</h2>
    <div class="tabs"><button id="tb-plug" class="on" onclick="tab('plug')">插件 / 技能</button><button id="tb-mcp" onclick="tab('mcp')">MCP 服务器</button><button id="tb-mgr" onclick="tab('mgr')">管理</button></div>
    <span id="pstat" title="本地工具调用补丁(8081)状态">检测中…</span>
  </div>
  <p class="sub">搜索社区插件/技能或 MCP 服务器,点【一键安装 / 部署】即可;插件经 <code>dsh plugin add</code> 安装,MCP 记录到受管注册(DSH 侧接入为后续增强)。</p>

  <div id="prog"><div class="lbl"><span id="plbl">正在安装...</span><span id="ppct">0%</span></div><div id="bar"><i id="pfill"></i></div><div id="plog"></div></div>

  <div id="plug">
    <div class="search"><input id="q" placeholder="搜索社区插件, 例如: deepseek harness" value="deepseek harness" /><button id="go">搜索</button></div>
    <div id="results">加载引导中...</div>
  </div>
  <div id="mcp" style="display:none">
    <div class="search"><input id="mq" placeholder="搜索 MCP 服务器, 例如: filesystem mcp" value="filesystem mcp" /><button id="mgo">搜索</button></div>
    <div id="mresults">加载引导中...</div>
  </div>
  <div id="mgr" style="display:none">
    <p class="sub">已部署的插件与 MCP 服务器,可【启用 / 停用】(切换受管注册状态, DSH 侧生效为后续增强),也可删除。</p>
    <div id="mresults2">加载中...</div>
  </div>
  <div class="status" id="status"></div>

<script>
  const results=document.getElementById('results'), mresults=document.getElementById('mresults'),
        status=document.getElementById('status'), q=document.getElementById('q'), go=document.getElementById('go'),
        mq=document.getElementById('mq'), mgo=document.getElementById('mgo');
  const prog=document.getElementById('prog'), pfill=document.getElementById('pfill'), plog=document.getElementById('plog'),
        ppct=document.getElementById('ppct'), plbl=document.getElementById('plbl');

  // HTML 转义(GitHub 内容不可信, 防注入) + onclick 内嵌 JSON 的安全编码
  const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const jq  = o => JSON.stringify(o).replace(/[&"]/g, c => (c==='&' ? '&amp;' : '&quot;'));

  // 补丁(8081)在线状态
  async function checkProxy(){
    const ps=document.getElementById('pstat');
    const r=await window.harnessDesktop.checkProxy();
    if(r.ok && r.models && r.models.length){
      ps.textContent='补丁在线 · '+r.models[0];
      ps.className='on';
      ps.title='本地补丁(8081)在线, 可用模型: '+(r.models.join(', '));
    } else {
      ps.textContent='补丁离线';
      ps.className='off';
      ps.title='未检测到本地补丁(8081)。请确认 scripts/qwen_tool_proxy.py 已启动、上游模型服务在跑。';
    }
  }

  window.harnessDesktop.onInstallProgress(d=>{
    prog.style.display='block';
    if(d.done){
      pfill.style.width='100%'; ppct.textContent='完成'; plbl.textContent=d.code===0?'✅ 安装成功':'安装失败';
      setTimeout(()=>{prog.style.display='none';pfill.style.width='0%';plog.textContent='';},2200);
      if(d.code===0 && document.getElementById('mgr').style.display==='block') renderMgr();
      return;
    }
    plog.textContent=(d.line||'').slice(0,300);
  });
  function tab(t){ document.getElementById('plug').style.display = t==='plug'?'block':'none';
    document.getElementById('mcp').style.display = t==='mcp'?'block':'none';
    document.getElementById('mgr').style.display = t==='mgr'?'block':'none';
    document.getElementById('tb-plug').className = t==='plug'?'on':'';
    document.getElementById('tb-mcp').className = t==='mcp'?'on':'';
    document.getElementById('tb-mgr').className = t==='mgr'?'on':'';
    if(t==='mgr') renderMgr(); }

  async function renderMgr(){
    const em=document.getElementById('mresults2');
    const d=await window.harnessDesktop.getManaged();
    const plats = [['plugins','插件'],['mcp','MCP 服务器']];
    let h='';
    for(const [k,label] of plats){
      const arr=d[k]||[];
      if(!arr.length){ h+=`<div class="card"><div class="name">${label}</div><div class="desc">暂无已部署项。先在「插件 / 技能」或「MCP 服务器」Tab 里一键安装 / 部署。</div></div>`; continue; }
      h+=`<div class="card"><div class="name">${label}</div>`+arr.map(x=>{
        const on=!!x.enabled;
        const spec=jq({kind:k,name:x.name});
        return `<div class="mi2"><span>${esc(x.name)}</span><span class="acts">
          <button class="${on?'stop':'go'}" onclick="toggleM(${spec})">${on?'停用':'启用'}</button>
          <button class="del" onclick="delM(${spec})">删除</button></span></div>`;
      }).join('')+`</div>`;
    }
    em.innerHTML=h;
  }
  window.toggleM = async spec=>{ status.textContent='切换中...'; const r=await window.harnessDesktop.toggleManaged({kind:spec.kind,name:spec.name,enabled:null});
    status.textContent=r.ok?'✅ 已更新':'❌ '+r.error; renderMgr(); };
  window.delM = async spec=>{ if(!confirm(`确定删除「${spec.name}」? 删除后需重新安装/部署。`)) return;
    status.textContent='删除中...'; const r=await window.harnessDesktop.deleteManaged({kind:spec.kind,name:spec.name});
    status.textContent=r.ok?'✅ 已删除':'❌ '+r.error; renderMgr(); };

  const curatedPlugins=[
    {name:'DSH Agent 预设', desc:'standard / code / minimal 多套 Agent 预设(内置)', pkg:'@deepseek-ai/dsh-agent-presets', url:''},
    {name:'Cordis 插件开发技能', desc:'用 Cordis 编写/扩展 DSH 插件(内置技能)', pkg:'', url:''},
    {name:'本地工具调用补丁', desc:'把本地模型 <tools> 改写为标准 tool_calls(自带)', pkg:'', url:''}
  ];
  const curatedMcp=[
    {name:'filesystem', desc:'访问本地文件系统(读/写/搜索)', cmd:'npx', args:['-y','@modelcontextprotocol/server-filesystem','.']},
    {name:'fetch', desc:'抓取网页内容', cmd:'npx', args:['-y','@modelcontextprotocol/server-fetch']},
    {name:'memory', desc:'知识库/记忆', cmd:'npx', args:['-y','@modelcontextprotocol/server-memory']}
  ];

  function card(it, kind){
    const acts = it.url ? `<a href="${esc(it.url)}" target="_blank">打开仓库 ↗</a>` : '';
    let btn='';
    if(kind==='mcp'){ if(it.cmd) btn=`<button class="g" onclick="deployMcp(${jq({name:it.name,cmd:it.cmd,args:it.args||[]})})">一键部署</button>`; }
    else if(it.pkg){ btn=`<button onclick="install(${jq(it.pkg)})">一键安装</button>`; }
    const meta = it.pkg ? `<span class="pkg">${esc(it.pkg)}</span>` : '';
    return `<div class="card"><div class="name">${esc(it.name)}</div><div class="desc">${esc(it.desc||'')}</div><div class="acts">${acts}${btn}${meta}</div></div>`;
  }
  function render(el, list, kind, note){
    el.innerHTML = (note?`<div class="card"><div class="desc">${esc(note)}</div></div>`:'') +
      (list.length? list.map(x=>card(x,kind)).join('') : '<div class="card"><div class="desc">没有结果, 换个关键词试试。</div></div>');
  }
  function showPlug(list, note){ render(results, list, 'plug', note); status.textContent=''; }
  function showMcp(list, note){ render(mresults, list, 'mcp', note); }

  async function searchPlug(){ const kw=q.value.trim(); if(!kw)return; status.textContent='正在搜索...';
    const r=await window.harnessDesktop.searchPlugins(kw); status.textContent=r.ok?`找到 ${r.items.length} 个仓库`:'✗ '+r.error;
    const list=(r.items||[]).slice(0,25).map(x=>({name:x.full_name,desc:(x.description||'')+'(源码仓库, 需发布为 npm 包才能一键安装; 请点打开仓库查看安装说明)',url:x.html_url}));
    showPlug(list.length?list:curatedPlugins, list.length?'':'未命中, 回退精选:'); }
  async function searchMcp(){ const kw=mq.value.trim(); if(!kw)return; status.textContent='正在搜索...';
    const r=await window.harnessDesktop.searchPlugins(kw+' mcp'); status.textContent=r.ok?`找到 ${r.items.length} 个仓库`:'✗ '+r.error;
    const list=(r.items||[]).slice(0,25).map(x=>({name:x.full_name,desc:(x.description||'')+'(源码仓库; 一键部署将用 npx 尝试运行, 请先确认仓库发布为 npm 包)',url:x.html_url,cmd:'npx',args:['-y',x.full_name]}));
    showMcp(list.length?list:curatedMcp, list.length?'':'未命中, 回退精选:'); }

  window.install = async pkg=>{ status.textContent='一键安装中: '+pkg+' ...';
    const r=await window.harnessDesktop.installPlugin({pkg}); status.textContent=r.ok?'✅ '+r.message:'❌ '+r.error; };
  window.deployMcp = async spec=>{ status.textContent='部署 MCP: '+spec.name+' ...';
    const r=await window.harnessDesktop.deployMcp({name:spec.name, command:spec.cmd, args:spec.args||[]});
    status.textContent=r.ok?'✅ '+r.message:'❌ '+r.error; };

  window.addEventListener('DOMContentLoaded', ()=>{ showPlug(curatedPlugins,'精选(内置/开箱即用):'); showMcp(curatedMcp,'精选 MCP:'); checkProxy(); });
  go.addEventListener('click', searchPlug); q.addEventListener('keydown',e=>{if(e.key==='Enter')searchPlug();});
  mgo.addEventListener('click', searchMcp); mq.addEventListener('keydown',e=>{if(e.key==='Enter')searchMcp();});
</script>
</body>
</html>
